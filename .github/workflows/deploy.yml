# Deploy this repo's docs/ folder to GitHub Pages.
# 1. Push this file (it triggers the workflow automatically)
# 2. In the repo go to: Settings -> Pages -> Source: select "GitHub Actions"
# 3. Wait ~1 minute, then open: https://<your-username>.github.io/Birthday-s-wish/

name: Deploy to GitHub Pages

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site (docs folder)
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
